# Development Environment Configuration

# HTTP Configuration
http.host=0.0.0.0
http.port=8081

# File System Configuration
file.working.dir=/tmp/files-to-idp-to-sap
file.input.dir=/tmp/files-to-idp-to-sap/input
file.archive.dir=/tmp/files-to-idp-to-sap/archive
file.polling.frequency=30

# IDP Configuration
idp.host=dev-idp.company.com
idp.port=443
idp.protocol=HTTPS
idp.auth.path=/oauth/token
idp.data.path=/api/v1/data

# SAP Configuration
sap.host=sap-dev.company.com
sap.system.number=00
sap.client=100
sap.username=DEV_USER
sap.language=EN

# SFTP Configuration (if needed)
sftp.host=sftp-dev.company.com
sftp.port=22
sftp.username=dev_sftp_user